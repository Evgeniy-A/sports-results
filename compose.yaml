services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sports_results
      POSTGRES_USER: sports_results
      POSTGRES_PASSWORD: sports_results
    ports:
      - "5432:5432"
    volumes:
      - sports-results-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports_results -d sports_results"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sports-results-postgres:
